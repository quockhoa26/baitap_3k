<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Form - Phần 1</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
        }
        .form-container {
            max-width: 450px;
            background-color: #ffffff;
            margin: 0 auto;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1e88e5;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkbox-group label {
            display: inline-block;
            font-weight: normal;
            margin-right: 15px;
            cursor: pointer;
        }
        .btn-group {
            margin-top: 20px;
            text-align: center;
        }
        input[type="submit"] {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 10px;
        }
        input[type="reset"] {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }
        input[type="submit"]:hover { background-color: #218838; }
        input[type="reset"]:hover { background-color: #c82333; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>SỞ THÍCH CỦA BẠN</h2>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Nhập email..." required>
            </div>

            <div class="form-group checkbox-group">
                <label>Sở thích:</label><br>
                <label><input type="checkbox" name="hobby" value="thethao"> Thể thao</label>
                <label><input type="checkbox" name="hobby" value="amnhac"> Âm nhạc</label>
                <label><input type="checkbox" name="hobby" value="dientu"> Chơi game</label>
                <label><input type="checkbox" name="hobby" value="dudulich"> Du lịch</label>
            </div>

            <div class="btn-group">
                <input type="submit" value="Gửi thông tin">
                <input type="reset" value="Nhập lại">
            </div>
        </form>
    </div>

</body>
</html>
